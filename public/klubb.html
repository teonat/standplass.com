<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klubb – Standplass</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/themes.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="site-logo">STANDPLASS</a>
      <nav aria-label="Hovedmeny">
        <div class="nav-dropdown">
          <button type="button" class="nav-dropdown-btn" aria-expanded="false" aria-controls="nav-resultater-menu">Resultater ▾</button>
          <div class="nav-dropdown-menu" id="nav-resultater-menu" hidden>
            <a href="/felt">Feltskyting</a>
            <a href="/bane">Baneskyting</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <button type="button" class="nav-dropdown-btn" aria-expanded="false" aria-controls="nav-topplister-menu">Topplister ▾</button>
          <div class="nav-dropdown-menu" id="nav-topplister-menu" hidden>
            <a href="/klubb">Klubb</a>
            <a href="/nasjonalt">Nasjonalt</a>
          </div>
        </div>
        <a href="/terminliste?t_gren=0beff7e2-94f7-4284-b76e-fc3e17b29e4f" class="nav-link">Terminliste</a>
      </nav>
      <button type="button" id="site-mode-toggle" aria-label="Bytt mellom lyst og mørkt tema" aria-pressed="false">◐</button>
    </div>
  </header>
  <main id="klubb-root" class="ranking-section">
    <div class="container">
      <p class="section-label">Resultater</p>
      <h1 class="section-title">Klubb</h1>
      <p class="section-lead">Klubbens medlemmer rangert per øvelse, filtrert fra NSFs offisielle rangering
        (<a href="https://www.skyting.no/pistol/100-pa-topp-pistol/" target="_blank" rel="noopener noreferrer">«100 på topp» – pistol</a>) på skyting.no.</p>
      <div id="klubb-picker"></div>
      <!-- ponytail: klubb-page.js's loadAll() does gridWrapEl.innerHTML = ''
           on every reload, where gridWrapEl = id('-grid-wrap'). Filters and
           the felt/bane toggle live outside #klubb-grid-wrap (not nested
           inside it, unlike the plan's literal markup) so they survive
           those reloads instead of being wiped a few seconds after first
           paint. #klubb-results has no hidden attribute of its own -- the
           CSS :has() rule below mirrors #klubb-grid-wrap's hidden state so
           show/hide still tracks the one element klubb-page.js actually
           toggles. -->
      <div id="klubb-results">
        <div class="ranking-filters">
          <div class="filter-group">
            <label for="klubb-year-select">Sesong</label>
            <select id="klubb-year-select"></select>
          </div>
          <div class="filter-group">
            <label for="klubb-num-select">Tellende res.</label>
            <select id="klubb-num-select">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
        </div>
        <div class="program-toggle" role="group" aria-label="Program">
          <button type="button" id="klubb-toggle-felt" class="program-btn program-btn--active" aria-pressed="true">Felt</button>
          <button type="button" id="klubb-toggle-bane" class="program-btn" aria-pressed="false">Bane</button>
        </div>
        <div id="klubb-grid-wrap" class="ranking-grid" hidden></div>
      </div>
    </div>
  </main>
  <script src="/js/mode-resolve.js"></script>
  <script src="/js/site-chrome.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/data-fetch-cache.js"></script>
  <script src="/js/person-modal.js"></script>
  <script src="/js/person-modal-controller.js"></script>
  <script src="/js/filter-widgets.js"></script>
  <script src="/js/url-state.js"></script>
  <script src="/js/comp-modal.js"></script>
  <script src="/js/nsf-orgs.js"></script>
  <script src="/js/klubb-discipline-groups.js"></script>
  <script src="/js/stevner-page.js"></script>
  <script src="/js/klubb-page.js"></script>
  <script>
    StandplassKlubbPage.init({
      idPrefix: 'klubb',
      root: document,
      urlState: StandplassUrlState.createController({ namespace: null })
    });
  </script>
</body>
</html>
