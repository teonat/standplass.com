<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standplass</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/themes.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="site-logo">STANDPLASS</a>
      <nav aria-label="Hovedmeny">
        <div class="nav-dropdown">
          <button type="button" class="nav-dropdown-btn" aria-expanded="false" aria-controls="nav-resultater-menu">Resultater ▾</button>
          <div class="nav-dropdown-menu" id="nav-resultater-menu" hidden>
            <a href="/felt">Feltskyting</a>
            <a href="/bane">Baneskyting</a>
            <a href="/klubb">Klubb</a>
          </div>
        </div>
      </nav>
      <button type="button" id="site-mode-toggle" aria-label="Bytt mellom lyst og mørkt tema" aria-pressed="false">◐</button>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <h1>Resultater fra norsk skytesport</h1>
          <p>Feltskyting og baneskyting fra skyting.no – samlet og søkbart, og
          kan bygges inn på din egen klubbside som en webkomponent.</p>
          <div class="hero-cta">
            <a href="/felt" class="btn btn-primary">Se resultater</a>
            <a href="https://github.com/teonat/standplass.com" class="btn" target="_blank" rel="noopener noreferrer">Kildekode på GitHub</a>
          </div>
          <p class="hero-note">Siden er under utvikling – ting kan endre seg uten varsel.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/mode-resolve.js"></script>
  <script src="/js/site-chrome.js"></script>
</body>
</html>
