# .github/workflows/scrape-bane.yml
name: Scrape bane results

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run – skip data commit (for testing)'
        type: boolean
        default: false
      full_scan:
        description: 'Full scan – re-process all competitions for active years'
        type: boolean
        default: false
      year:
        description: 'Process only a specific year (0 = all active years)'
        type: number
        default: 0

permissions:
  contents: write

jobs:
  scrape-bane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Scrape bane results
        run: python .github/scripts/scrape_bane.py
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
          YEAR: ${{ inputs.year }}

      - name: Commit data if changed
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/bane/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update bane results"
            git push
          fi
