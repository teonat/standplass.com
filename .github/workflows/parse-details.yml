# .github/workflows/parse-details.yml
name: Parse result details

on:
  schedule:
    - cron: '0 8 * * *'   # daily incremental, after the 04:00/06:00 scrapers commit
    - cron: '0 9 * * 0'   # weekly etag freshness sweep (Sundays)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run – parse but skip the data commit'
        type: boolean
        default: false
      all:
        description: 'Full scan – process every year, not just recent ones'
        type: boolean
        default: false
      year:
        description: 'Process only a specific year (0 = all in scope)'
        type: number
        default: 0
      branch:
        description: 'Process only one branch (felt | bane; empty = both)'
        type: string
        default: ''
      sweep:
        description: 'ETag sweep – conditional-GET parsed PDFs for replacements'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  parse-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Parse result details
        run: python .github/scripts/parse_result_files.py
        env:
          FULL_SCAN: ${{ inputs.all }}
          YEAR: ${{ inputs.year }}
          BRANCH: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          SWEEP: ${{ github.event.schedule == '0 9 * * 0' || inputs.sweep }}

      - name: Commit data if changed
        # run even when parsing ended non-zero: a single dead
        # resultFileUrl must not discard the whole run's work — the
        # job stays red as the signal, the data still lands
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for dir in public/data/detaljer public/data/felt public/data/bane; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update result details"
            git push
          fi
