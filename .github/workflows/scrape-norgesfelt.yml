name: Scrape norgesfelt results

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run – skip data commit (for testing)'
        type: boolean
        default: false
      retry_count:
        description: 'Number of retries already attempted (managed automatically)'
        type: number
        default: 0

permissions:
  contents: write
  actions: write

jobs:
  scrape-norgesfelt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Scrape norgesfelt.no
        run: python .github/scripts/scrape_norgesfelt.py

      - name: Commit data if changed
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/norgesfelt.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update norgesfelt results"
            git push
          fi

      - name: Schedule retry on failure
        if: failure() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_COUNT: ${{ inputs.retry_count }}
        run: |
          count=${RETRY_COUNT:-0}
          if [ "$count" -lt 3 ]; then
            echo "Scrape failed (attempt $((count + 1)) of 4). Scheduling retry $((count + 1)) of 3..."
            gh workflow run scrape-norgesfelt.yml --field retry_count=$((count + 1))
          else
            echo "Max retries reached (3 of 3). Giving up."
          fi
