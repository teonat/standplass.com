<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed-sjekk — terminliste, kompakt</title>
<!-- Compact mode. NB: compact is a TERMINLISTE-only attribute (the
     embed's buildMarkupFor ignores it for felt/bane), and the compact
     terminliste is org-scoped BY DESIGN — it mirrors the source's
     stevner-widget.js, a single club's schedule — so the klubb
     attribute is REQUIRED here; without it the view renders
     "Ukjent klubb." The full terminliste view (terminliste.html)
     instead has its own club picker and needs no attribute. -->
<link rel="stylesheet" href="rig.css">
</head>
<body>
<nav class="rig-nav">
    <a href="./">Alle tilfeller</a>
    <a href="felt.html">felt</a>
    <a href="bane.html">bane</a>
    <a href="terminliste.html">terminliste</a>
    <a href="klubb.html">klubb</a>
    <a href="compact.html" aria-current="page">compact</a>
    <a href="duplicate.html">duplikat-id</a>
    <a href="mode.html">mode</a>
</nav>
<h1>Din Skytterklubb</h1>
<p class="embed-note">
    Simulert klubbside for embed-QA. Denne siden laster inn
    <code>&lt;standplass-results&gt;</code> fra
    <span id="embed-origin">(laster…)</span>.
</p>
<p id="embed-status" class="embed-note"></p>

<h2>Terminliste (kompakt)</h2>
<standplass-results view="terminliste" compact klubb="Kongsvinger Sportsskyttere"></standplass-results>

<script src="rig.js"></script>
</body>
</html>
