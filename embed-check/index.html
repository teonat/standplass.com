<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultater — Din Skytterklubb (embed-sjekk)</title>
<!--
  embed-check/index.html — the permanent local 3rd-party consumer page
  for <standplass-results> QA ("just embed-check", port 8890).

  What makes this page a real embed test (the felt/bane pages on :8800
  only exercise the direct-mount adapter):
  - it is a DIFFERENT origin, so embed.js, its /js/* dependencies and
    the /data/* fetches all go cross-origin (CORS) to the embed's own
    origin, resolved from where embed.js itself was loaded;
  - it has none of standplass's styles — the element must bring
    everything it needs into its Shadow DOM (:host, not :root);
  - the consumer's URL bar belongs to this page, not the embed:
    without sync-url nothing may touch it.

  QA checklist when using this page:
  1. Both instances render and fetch data (network tab: scripts and
     data all come from the embed origin, never :8890).
  2. Shadow DOM styling holds against this page's serif host styling;
     test light and dark (the embed follows prefers-color-scheme, or
     force it with a mode="light" / mode="dark" attribute).
  3. The felt instance (sync-url) may write filter state to the URL
     bar; the bane instance must not. Escape closes modals without
     leaking key handling to this page.
  4. Console stays clean (the duplicate-namespace warning is expected
     only with two synced instances of the same id-less view — see
     the templates at the bottom).
  5. Resize to ~390px: the embed handles its own responsive layout.

  Point the rig at another deployment with ?origin=... (default: the
  local dev server on :8800, which must be running — "just start").
-->
<style>
    /* Deliberately NOT standplass styling: this page plays a foreign
       site (serif, warm paper background), so any styling the embed
       needs has to arrive through its own Shadow DOM. */
    body {
        font-family: Georgia, 'Times New Roman', serif;
        max-width: 46rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
        background: #f7f4ee;
    }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.1rem; margin-top: 2.5rem; }
    .embed-note { font-size: 0.85rem; color: #666; }
    .embed-error { color: #a00; font-weight: bold; }
</style>
</head>
<body>
<h1>Din Skytterklubb</h1>
<p class="embed-note">
    Simulert klubbside for embed-QA. Denne siden laster inn
    <code>&lt;standplass-results&gt;</code> fra
    <span id="embed-origin">(laster…)</span>.
    Bruk <code>?origin=…</code> for å peke mot en annen utrulling
    (f.eks. <code>?origin=https://standplass.com</code>).
</p>
<p id="embed-status" class="embed-note"></p>

<h2>Feltskyting (med URL-sync)</h2>
<standplass-results view="felt" sync-url></standplass-results>

<h2>Baneskyting (uten URL-sync)</h2>
<standplass-results view="bane"></standplass-results>

<!-- Instance templates for other QA cases — uncomment as needed:
<standplass-results view="felt" klubb="Klubbnavn her"></standplass-results>
<standplass-results view="felt" compact></standplass-results>
<standplass-results view="terminliste"></standplass-results>
(two synced instances of the same view without distinct id="" attributes
 demonstrate the duplicate-namespace console warning)
<standplass-results view="felt" sync-url></standplass-results>
<standplass-results view="felt" sync-url></standplass-results>
-->

<script>
    // Loads embed.js from the target deployment. Kept tiny and inline:
    // this page is a QA rig, not product code — no build step, no
    // dependencies. embed.js reads document.currentScript during its
    // own synchronous top-level execution, which is also set for
    // dynamically inserted tags, so its SELF_ORIGIN still resolves to
    // the origin this tag was fetched from.
    (function () {
        var origin = new URLSearchParams(location.search).get('origin') || 'http://localhost:8800';
        document.getElementById('embed-origin').textContent = origin;
        var status = document.getElementById('embed-status');
        var s = document.createElement('script');
        s.src = origin + '/embed.js';
        s.onload = function () { status.textContent = 'embed.js lastet fra ' + origin; };
        s.onerror = function () {
            status.textContent = 'Kunne ikke laste ' + origin + '/embed.js — er riktig server oppe? (standard: "just start" på :8800)';
            status.className = 'embed-error';
        };
        document.head.appendChild(s);
    })();
</script>
</body>
</html>
